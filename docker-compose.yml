name: game-store-project

services:
  db:
    image: postgres:16
    container_name: game-db
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: game_db
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: python:3.13
    container_name: game-app
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    ports:
      - "8002:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: